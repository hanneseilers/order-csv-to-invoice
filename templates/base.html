<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Rechnung{% endblock %}</title>
  <style>
    @page { size: A4; margin: 18mm; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 12px; color: #111; }
    h1, h2, h3 { margin: 0 0 6px 0; }
    .header { margin-bottom: 12mm; }
    .brand { font-size: 18px; font-weight: 700; }
    .muted { color: #555; }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .col { flex: 1; }
    .right { text-align: right; }
    .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
    .box { border: 1px solid #ddd; padding: 8px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 6px; vertical-align: top; }
    th { background: #f5f5f5; text-align: left; }
    .totals td { border: none; }
    .qr { text-align: center; }
    .small { font-size: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
